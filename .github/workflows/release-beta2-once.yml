# Ephemeral, repository-scoped one-shot release publishing. NO external tokens.
name: Publish NEBOA beta2 once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-beta2-once.yml"
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'Neboamusic/neboa-dj-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish existing beta2 tag as a pre-release, once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.4.1-beta.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "NEBØA DJ Studio 0.4.1-beta.2 — Artist & Community" \
            --notes-file docs/RELEASE-v0.4.1-beta.2.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,tagName
