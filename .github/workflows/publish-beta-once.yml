# One-time repository-scoped release publication through GitHub's official API.
# Triggered only by a push modifying this workflow. No external secrets, accounts
# or corporate runners. Uses the ephemeral GITHUB_TOKEN of NEBOA's own repository.
name: Publish NEBOA beta 0.4.1 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-beta-once.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Neboamusic/neboa-dj-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and create pre-release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.4.1-beta.1'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "NEBØA DJ Studio 0.4.1 — Public beta" \
            --notes-file docs/RELEASE-v0.4.1-beta.1.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,tagName
